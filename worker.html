<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Eksperimen</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0; padding: 0; background: #0f172a; color: #f8fafc;
            display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }
        .center-box {
            text-align: center; max-width: 400px; width: 90%; padding: 2rem;
            background: #1e293b; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #38bdf8; }
        p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 2rem; }
        .btn-action {
            background: #4f46e5; color: white; border: none; padding: 0.75rem 1.5rem;
            font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%;
            display: none; transition: background 0.2s;
        }
        .btn-action:hover { background: #4338ca; }
        .status { margin-top: 1.5rem; font-size: 0.85rem; color: #64748b; }
    </style>
</head>
<body>

    <div class="center-box">
        <div style="font-size: 3.5rem; margin-bottom: 1rem;">⚡</div>
        <h1>PWA Fitur Instalasi</h1>
        <p>Gunakan tombol di bawah ini untuk memicu proses instalasi aplikasi secara mandiri.</p>
        
        <button id="installBtn" class="btn-action">Pasang Aplikasi</button>
        
        <div id="statusText" class="status">Menyiapkan sistem...</div>
    </div>

    <script>
        const installBtn = document.getElementById('installBtn');
        const statusText = document.getElementById('statusText');
        let deferredPrompt;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => statusText.textContent = 'Service Worker terdaftar.')
                .catch(() => statusText.textContent = 'Gagal memuat Service Worker.');
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
            statusText.textContent = 'Aplikasi siap diinstal!';
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            installBtn.style.style.display = 'none';
            
            alert(2);
            window.location.reload();
        });

        window.addEventListener('appinstalled', () => {
            statusText.textContent = 'PWA Berhasil Terpasang! 🎉';
        });
    </script>
</body>
</html>
